spring.application.name=crm

# --- CORS (pl.gg.crm.config.CorsProperties) ---
# Lista originów oddzielona przecinkami ('*' niedozwolone). Domyślnie tylko dev server Reacta (Vite).
# Pozostałe klucze (allowed-methods, allowed-headers, exposed-headers, max-age) mają domyślne wartości w kodzie.
crm.security.cors.allowed-origins=http://localhost:5173

# --- JWT RS256 (pl.gg.crm.security.jwt.JwtProperties) ---
# TODO(JWT): ustawić klucze publiczne RSA (PEM) per kid. Kluczy NIE trzymać w repozytorium - podawać ścieżkę
# do pliku/secretu, np. przez zmienną środowiskową. Bez żadnego klucza JWT jest wyłączony (wszystko poza publicznymi -> 401).
# Kilka wpisów = rotacja (stare i nowe tokeny przechodzą weryfikację).
#crm.security.jwt.public-keys[2026-11]=file:${CRM_JWT_PUBLIC_KEY_PATH}

# Uzgodniony kontrakt - wartości domyślne:
#crm.security.jwt.issuer=crm-auth
#crm.security.jwt.audience=crm-api
#crm.security.jwt.user-id-claim=sub
# Robocze nazwy claimów (do potwierdzenia):
#crm.security.jwt.roles-claim=roles
#crm.security.jwt.permissions-claim=permissions

# --- Dostęp do rekordów (pl.gg.crm.security.access.ResourceAccessProperties) - wartości domyślne: ---
#crm.security.access.project-view-all-authority=PROJECT_VIEW_ALL
#crm.security.access.task-view-all-authority=TASK_VIEW_ALL
#crm.security.access.client-view-all-authority=CLIENT_VIEW_ALL
#crm.security.access.designer-view-all-authority=DESIGNER_VIEW_ALL
