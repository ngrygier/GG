spring:
  profiles:
    active: dev
  application:
    name: crm
  # Allows the same local .env file to be used by Docker Compose and Spring Boot.
  # It is optional so production values can be supplied only by the environment.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # `update` bootstraps a developer database until versioned migrations are added.
      # Deployments should set DDL_AUTO=validate (or a stricter production value).
      ddl-auto: ${DDL_AUTO:update}

# --- CORS (pl.gg.crm.config.CorsProperties) ---
# Comma-separated origins; '*' is not permitted. Defaults to the React/Vite dev server.
crm:
  security:
    jwt:
      issuer: crm-auth
      audience: crm-api

      public-keys:
        local-dev: file:./secrets/jwt-public.pem

      signing:
        private-key: file:./secrets/jwt-private.pem
        public-key: file:./secrets/jwt-public.pem
        key-id: local-dev
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT RS256 settings can be supplied through environment variables. Do not commit keys.
# Example: CRM_SECURITY_JWT_PUBLIC_KEYS_2026_11=file:${CRM_JWT_PUBLIC_KEY_PATH}
# The agreed defaults for issuer, audience, and claims remain in JwtProperties.
